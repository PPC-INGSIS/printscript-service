name: Publish

on:
  push:
    branches: [dev, main]

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: PPC-INGSIS/workflow/.github/workflows/docker-publish.yml@v3

  update-infra:
    needs: publish
    # Solo dev: prod se actualiza a mano
    if: github.ref_name == 'dev'
    # Temporal, para probarlo: se cambia a @v4 cuando se publique ese tag
    uses: PPC-INGSIS/workflow/.github/workflows/update-infra.yml@main
    with:
      image: ${{ needs.publish.outputs.image }}
      tag-var: PRINTSCRIPT_TAG
      client-id: ${{ vars.INFRA_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
