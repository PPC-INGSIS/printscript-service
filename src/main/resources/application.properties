spring.application.name=printscript

# 8082 es el puerto para desarrollo local (bootRun), reservado en el repo infraestructura
# para no chocar con los otros servicios. En Docker el servicio escucha en 8080: el compose
# de infraestructura lo pisa con la variable SERVER_PORT=8080 y publica 127.0.0.1:8082:8080.
server.port=8082
