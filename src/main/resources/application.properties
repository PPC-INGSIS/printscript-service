spring.application.name=printscript

# Variables locales desde .env (ver .env.example); en Docker llegan del entorno
spring.config.import=optional:file:.env[.properties]

# 8082 es el puerto para desarrollo local (bootRun), reservado en el repo infraestructura
# para no chocar con los otros servicios. En Docker el servicio escucha en 8080: el compose
# de infraestructura lo pisa con la variable SERVER_PORT=8080 y publica 127.0.0.1:8082:8080.
server.port=8082

# Los 4xx que arma Spring (falta un campo, JSON mal formado, 415) también salen como problem+json
spring.mvc.problemdetails.enabled=true

# Topes para que un snippet no tire la JVM: tamaño de `code`, salida acumulada de /execute y su timeout
printscript.limits.max-code-size=64KB
printscript.limits.max-output-size=1MB
printscript.limits.execution-timeout=5s

# Topes de la ejecución interactiva por WebSocket. Su salida usa max-output-size, de arriba.
printscript.interactive.input-timeout=60s
printscript.interactive.max-duration=10m
printscript.interactive.max-sessions=16
printscript.interactive.max-pending-inputs=32
printscript.interactive.max-message-size=256KB
printscript.interactive.send-timeout=20s

# Auth0: quién emite los tokens (iss) y para qué API son (aud).
# Sin valores por defecto: si faltan, el servicio no arranca.
# El iss de Auth0 es "https://<dominio>/", con la barra final: Spring lo compara como texto exacto.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://${AUTH0_DOMAIN}/
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE}
