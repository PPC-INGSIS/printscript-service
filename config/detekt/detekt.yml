naming:
  ClassNaming:
    classPattern: '^(?!.*[A-Z]{3})[A-Z][A-Za-z0-9]*$'
  FunctionNaming:
    functionPattern: '^(?!.*[A-Z]{3})[a-z][A-Za-z0-9]*$'
  VariableNaming:
    variablePattern: '^(?!.*[A-Z]{3})[a-z][A-Za-z0-9]*$'

style:
  ReturnCount:
    active: true
    max: 4

complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 20
    ignoreSimpleWhenEntries: true